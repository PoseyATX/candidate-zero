name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node ^20.19.0 || >=22.12.0; pin 22 to stay clear
          # of the 20.x floor rather than trust "20" to resolve above it.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run harness suite
        run: npm run harness

      - name: Build (catches broken/orphaned index.html, missing UI bundle, etc.)
        run: npm run build

      - name: Build headless engine bundle (host/Unity binding artifact)
        run: npm run build:engine

      - name: Export content manifest (Unity ScriptableObject source)
        run: npm run export:content

      # The Unity host's C# DTOs are generated from the TS engine types. If a
      # type changed and the generated C# was not regenerated, the Unity build
      # would silently deserialize into missing/renamed fields. Fail loudly
      # here instead — this is what replaced four hand-maintained mirrors.
      - name: Unity binding drift check (generated C# must match TS types)
        run: npm run gen:unity:check

      # gen:unity:check covers the generated C# only. Nothing verified the
      # committed content manifest or engine bundle, so they silently rotted:
      # the committed manifest was missing the `promo` card kind and PR01
      # entirely, meaning sponsor cards would not exist in the Unity/iOS build.
      # Both artifacts are byte-reproducible under `npm ci`, so any diff after
      # the two steps above means someone changed source without regenerating.
      - name: Unity artifact drift check (committed exports must match source)
        run: |
          if ! git diff --exit-code --stat -- unity/; then
            echo ""
            echo "::error::Committed Unity artifacts are stale."
            echo "Run 'npm run export:content && npm run build:engine' and commit unity/."
            exit 1
          fi

      - name: Install Playwright browser (for UI smoke)
        run: npx playwright install --with-deps chromium

      - name: UI smoke test (drives the real built app; catches dead buttons, stuck modals, console errors)
        run: npm run smoke:ui

      - name: Accessibility audit (axe-core WCAG 2 A/AA; fails on any critical/serious)
        run: npm run a11y
