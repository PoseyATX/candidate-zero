<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="More Than Just a Pretty Face">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f5"/>
      <stop offset="35%" stop-color="#f8d5e0"/>
      <stop offset="70%" stop-color="#f5e6f0"/>
      <stop offset="100%" stop-color="#f0d4e4"/>
    </linearGradient>
    <radialGradient id="wash" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fff8fb" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f8bbd0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8a0b8" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- full face paper -->
  <rect width="600" height="900" rx="18" fill="url(#paper)"/>
  <rect width="600" height="900" rx="18" fill="url(#wash)"/>

  <!-- soft lips watermark -->
  <g opacity="0.22" fill="#e5739a">
    <ellipse cx="300" cy="430" rx="110" ry="55"/>
    <path d="M210 420c40-35 90-35 140 0 40-35 90-35 140 0-30 50-90 78-140 78s-110-28-140-78z"/>
  </g>

  <!-- ornate corner brackets -->
  <g fill="none" stroke="#c9a06a" stroke-width="2.2" opacity="0.85">
    <path d="M36 90c0-28 22-50 50-50"/>
    <path d="M36 90c18-8 28-22 32-40"/>
    <path d="M564 90c0-28-22-50-50-50"/>
    <path d="M564 90c-18-8-28-22-32-40"/>
    <path d="M36 810c0 28 22 50 50 50"/>
    <path d="M36 810c18 8 28 22 32 40"/>
    <path d="M564 810c0 28-22 50-50 50"/>
    <path d="M564 810c-18 8-28 22-32 40"/>
  </g>
  <g fill="#c9a06a" opacity="0.7">
    <path d="M48 55c12-18 28-28 48-32 4 10 6 18 6 28-18 2-32 8-42 18z"/>
    <path d="M552 55c-12-18-28-28-48-32-4 10-6 18-6 28 18 2 32 8 42 18z"/>
    <path d="M48 845c12 18 28 28 48 32 4-10 6-18 6-28-18-2-32-8-42-18z"/>
    <path d="M552 845c-12 18-28 28-48 32-4-10-6-18-6-28 18-2 32-8 42-18z"/>
  </g>

  <!-- inner frame -->
  <rect x="42" y="52" width="516" height="796" rx="8" fill="none" stroke="#c9a06a" stroke-width="1.4" opacity="0.55"/>

  <!-- gold star -->
  <g transform="translate(300 250)">
    <path d="M0-72 L18-22 72-18 30 18 42 72 0 42 -42 72 -30 18 -72-18 -18-22 Z" fill="#c9a84c"/>
    <path d="M0-56 L12-18 52-14 22 12 30 52 0 30 -30 52 -22 12 -52-14 -12-18 Z" fill="#e8d48a" opacity="0.55"/>
  </g>

  <!-- title -->
  <g fill="#5c1a32" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="300" y="420" font-size="42" letter-spacing="2">MORE THAN</text>
    <text x="300" y="478" font-size="42" letter-spacing="2">JUST A</text>
    <text x="300" y="536" font-size="42" letter-spacing="2">PRETTY</text>
    <text x="300" y="594" font-size="42" letter-spacing="2">FACE</text>
  </g>

  <!-- FREE seal -->
  <g transform="translate(300 760)">
    <ellipse rx="78" ry="28" fill="none" stroke="#c9a06a" stroke-width="2.5"/>
    <ellipse rx="70" ry="22" fill="none" stroke="#c9a06a" stroke-width="1.2" opacity="0.7"/>
    <text x="0" y="7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#6b2038" letter-spacing="4">FREE</text>
  </g>
</svg>
